name: Verify published release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Published tag to verify"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-verify-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify published release assets
    if: github.event_name == 'workflow_dispatch' || (!github.event.release.prerelease && startsWith(github.event.release.tag_name, 'v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
          persist-credentials: false
          sparse-checkout: scripts/verify-release-assets.mjs
          sparse-checkout-cone-mode: false
      - name: Download and verify the published release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          test -n "$TAG" || { echo "::error::missing release tag"; exit 1; }
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::release tag must be vX.Y.Z, got: $TAG"; exit 1; }
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease --jq 'select(.isDraft == false and .isPrerelease == false) | true' | grep -q true || {
              echo "::error::$TAG is not a published stable release in $GITHUB_REPOSITORY"; exit 1; }
          mkdir assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir assets \
            --pattern '*.yml' --pattern 'OpenMausBot*' --pattern 'SHA256SUMS-ubuntu-x64.txt'
          node scripts/verify-release-assets.mjs assets "${TAG#v}"
          node --input-type=module - "$TAG" <<'EOF'
          import { createHash } from "node:crypto";
          import { execFileSync } from "node:child_process";
          import { readFileSync, readdirSync } from "node:fs";
          import { join } from "node:path";
          const tag = process.argv[2];
          const expected = new Map(readdirSync("assets").map((name) => [
            name,
            `sha256:${createHash("sha256").update(readFileSync(join("assets", name))).digest("hex")}`,
          ]));
          const inventory = JSON.parse(execFileSync("gh", ["release", "view", tag, "--repo", process.env.GITHUB_REPOSITORY, "--json", "assets"], { encoding: "utf8" })).assets;
          const npmTarball = `openmausbot-${tag.slice(1)}.tgz`;
          const desktop = inventory.filter((asset) => asset.name !== npmTarball);
          if (inventory.length - desktop.length > 1) throw new Error(`duplicate npm asset: ${npmTarball}`);
          if (desktop.length !== expected.size) throw new Error(`release has ${desktop.length} desktop assets but ${expected.size} downloaded`);
          for (const asset of desktop) {
            if (expected.get(asset.name) !== asset.digest) throw new Error(`digest mismatch for ${asset.name}`);
          }
          console.log(`verified ${desktop.length} published desktop assets`);
          EOF

      - name: Refresh the Vercel docs
        env:
          DOCS_DEPLOY_HOOK_URL: ${{ secrets.DOCS_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DOCS_DEPLOY_HOOK_URL" ]; then
            echo "::notice::DOCS_DEPLOY_HOOK_URL is not configured; the changelog will refresh on the next docs deployment"
            exit 0
          fi
          curl --fail-with-body --silent --show-error --request POST "$DOCS_DEPLOY_HOOK_URL" > /dev/null
          echo "requested a docs rebuild"
